name: Pytest

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        torch-version: ["2.0.*", "2.1.*", "2.2.*"]

    name: Python ${{ matrix.python-version }} - PyTorch ${{ matrix.torch-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction --all-extras

      - name: Run tests with pytest
        env:
          PYTEST_CURRENT_TEST: ${{ matrix.python-version }}-${{ matrix.torch-version }}
        run: |
          poetry run pytest tests/ -v --tb=short --cov=pylandscape --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check test coverage
        run: |
          poetry run pytest tests/ --cov=pylandscape --cov-report=term-missing --cov-report=xml
          poetry run pytest tests/ --cov=pylandscape --cov-report=xml --cov-fail-under=50

  test-with-cuda:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    name: CUDA Tests (Python ${{ matrix.python-version }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with CUDA support
        run: |
          poetry install --no-interaction --all-extras

      - name: Set up CUDA
        uses: Jimver/cuda-toolkit@v0.2.1
        with:
          cuda: '12.1.0'
          method: 'devel'

      - name: Verify CUDA
        run: |
          nvcc --version
          python -c "import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}')"

      - name: Run CUDA tests
        env:
          PYTEST_CURRENT_TEST: cuda-${{ matrix.python-version }}
        run: |
          poetry run pytest tests/ -v --tb=short -m "not slow" --cov=pylandscape --cov-report=xml --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    name: Code linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction --all-extras

      - name: Run flake8
        run: |
          poetry run flake8 pylandscape/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run flake8 with max score
        run: |
          poetry run flake8 pylandscape/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics