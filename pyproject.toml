[tool.poetry]
name = "pylandscape"
version = "0.1.0"
description = "Python package to explore the loss landscape of Machine Learning models"
authors = ["Tommaso Baldi"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/balditommaso/PyLandscape"
repository = "https://github.com/balditommaso/PyLandscape"
packages = [
    { include = "pylandscape" },
    { include = "pylandscape/mc_utils" }
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
numpy = "*"
pandas = "*"
scipy = "*"
torch = "*"
tqdm = "*"
PyHessian = "*"
brevitas = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
torchvision = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=pylandscape --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "cuda: marks tests that require GPU (deselect with '-m \"not cuda\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["pylandscape"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__pycache__/*",
]
