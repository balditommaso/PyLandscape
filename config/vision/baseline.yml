save_dir: 'MobileNet'

# dataset config
data:
  name: ImageNetDataModule
  data_path: ./data/VISION/imageNet
  num_workers: 1
  val_size: 0.1
  num_classes: 1000


model:
  name: VisionModel
  size: 'baseline'
  quantization:
    verbose: 0
    input_quant: CommonIntActQuant
    

fit:
  # learning rate scheduler
  lr_scheduler: cosine
  label_smoothing: 0.1
  # regularization during training
  regularizer:
    l1: 0.0
    l2: 0.0005
    jacobian: 0.0
    parseval: 0.0
  
  # callbacks
  # early_stopping:
  #   monitor: val_loss 
  #   min_delta: 0.005 
  #   patience: 50  # removing the early stopping
  #   verbose: 1
  #   mode: min
  model_checkpoint:
    save_top_k: 1
    save_last: 0
    monitor: val_loss 
    mode: min
    auto_insert_metric_name: 0
  # PL trainer config
  trainer:
    max_epochs: 20
    accelerator: gpu
    # strategy: ddp


test:
  # noise:
